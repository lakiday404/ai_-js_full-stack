<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: rebeccapurple;

            /* 距离屏幕左边100px怎么设置 */
            /* margin-left: 100px; */

            /* 相对定位  */
            /* 相对原本文档流的位置进行位移 */
            position: relative;
            left: 100px; 
            top: 50px;
            
        }
        .box2{
            display: inline;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box2">hello world</div>
</body>
</html>
