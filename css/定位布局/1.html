<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
        }
        .box1{
            width: 100px;
            height: 100px;
            background-color: red;
            display: inline-block;
            /* inline就是行内元素 */
            /* display: inline; */
        }
        .box2{
            width: 200px;
            height: 100px;
            background-color: green;
            display: inline-block;
        }
        /* 不写 . ,就是选择a这个标签，加了.找名字为a的标签 */
        a{           
           width: 100px;
            /* 不可以设置宽高 */
        }
        
        
    </style>
</head>
<body>
    

    <div class="box1"></div>
    <div class="box2"></div>

    <a href="https://www.bilibili.com">bilibili干杯</a>
</body>
</html>
