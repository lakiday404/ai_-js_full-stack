<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            /* 外边距、内边距 */
            margin: 0;
            padding: 0;
        }
        ul{
            font-size: 0;
        }
        .item{
            width: 200px;
            height: 200px;
            font-size: 16px;
        }
        .item:nth-child(1){
            background-color: red;
            display: inline-block;
            
        }
        .item:nth-child(2){
            background-color: yellow;
            display: inline-block;
            

        }
        .item:nth-child(3){
            background-color: green;
            display: inline-block;
            

        }
    </style>
</head>
<body>
    <ul>
        <li class="item">1</li>
        <li class="item">2</li>
        <li class="item">3</li>
    </ul>    
</body>
</html>
